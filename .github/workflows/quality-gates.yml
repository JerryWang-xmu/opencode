name: quality-gates

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    name: coverage
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run tests with coverage
        working-directory: packages/opencode
        run: bun run test:coverage

      - name: Check coverage threshold
        working-directory: packages/opencode
        run: bun run script/check-coverage.ts --threshold 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/opencode/coverage/
            packages/opencode/.artifacts/coverage/

  flaky-detection:
    name: flaky-detection
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Prepare artifacts directory
        working-directory: packages/opencode
        run: mkdir -p .artifacts

      - name: Run tests (attempt 1)
        working-directory: packages/opencode
        run: bun test --timeout 30000 --reporter=json > .artifacts/test-run-1.json 2>&1 || true

      - name: Run tests (attempt 2)
        working-directory: packages/opencode
        run: bun test --timeout 30000 --reporter=json > .artifacts/test-run-2.json 2>&1 || true

      - name: Run tests (attempt 3)
        working-directory: packages/opencode
        run: bun test --timeout 30000 --reporter=json > .artifacts/test-run-3.json 2>&1 || true

      - name: Detect flaky tests
        working-directory: packages/opencode
        run: bun run script/detect-flaky.ts .artifacts/test-run-*.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flaky-test-results-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/opencode/.artifacts/test-run-*.json
            packages/opencode/.artifacts/flaky-tests.json

  summary:
    name: quality-gate-summary
    needs: [coverage, flaky-detection]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-report-${{ github.run_attempt }}
          path: coverage-artifacts
        continue-on-error: true

      - name: Download test results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: flaky-test-results-${{ github.run_attempt }}
          path: flaky-artifacts
        continue-on-error: true

      - name: Comment PR with quality gate results
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require("fs")
            const path = require("path")

            const coverageStatus = "${{ needs.coverage.result }}" === "success" ? "✅ Pass" : "❌ Fail"
            const flakyStatus = "${{ needs.flaky-detection.result }}" === "success" ? "✅ Pass" : "❌ Fail"
            const overallPass = coverageStatus === "✅ Pass" && flakyStatus === "✅ Pass"

            let coverageDetails = "Coverage report not available."
            const coveragePaths = [
              "coverage-artifacts/coverage-summary.json",
              "coverage-artifacts/packages/opencode/coverage/coverage-summary.json",
              "coverage-artifacts/packages/opencode/.artifacts/coverage/coverage-summary.json",
            ]
            const coverageSummaryPath = coveragePaths.find((p) => fs.existsSync(p))
            if (coverageSummaryPath) {
              const summary = JSON.parse(fs.readFileSync(coverageSummaryPath, "utf8"))
              coverageDetails = [
                `| Metric | Value | Threshold | Status |`,
                `|--------|-------|-----------|--------|`,
                `| Lines | ${summary.lines}% | 80% | ${summary.lines >= 80 ? "✅" : "❌"} |`,
                `| Functions | ${summary.functions}% | 80% | ${summary.functions >= 80 ? "✅" : "❌"} |`,
                `| Branches | ${summary.branches}% | 80% | ${summary.branches >= 80 ? "✅" : "❌"} |`,
                `| Statements | ${summary.statements}% | 80% | ${summary.statements >= 80 ? "✅" : "❌"} |`,
              ].join("\n")
            }

            let flakyDetails = "Flaky test report not available."
            const flakyPaths = [
              "flaky-artifacts/flaky-tests.json",
              "flaky-artifacts/packages/opencode/.artifacts/flaky-tests.json",
            ]
            const flakyPath = flakyPaths.find((p) => fs.existsSync(p))
            if (flakyPath) {
              const flaky = JSON.parse(fs.readFileSync(flakyPath, "utf8"))
              if (flaky.length === 0) {
                flakyDetails = "No flaky tests detected ✅"
              } else {
                flakyDetails = [
                  `**${flaky.length} flaky test(s) detected:**`,
                  "",
                  ...flaky.map((t) => `- \`${t.name}\` (${t.passRate}% pass rate, ${t.flakyRuns}/${t.totalRuns} inconsistent runs)`),
                ].join("\n")
              }
            }

            const body = [
              `## ${overallPass ? "✅" : "❌"} Quality Gates Report`,
              "",
              `### Coverage — ${coverageStatus}`,
              "",
              coverageDetails,
              "",
              `### Flaky Tests — ${flakyStatus}`,
              "",
              flakyDetails,
              "",
              "---",
              `<sub>Quality gates require ≥80% coverage and zero flaky tests.</sub>`,
            ].join("\n")

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            const botComment = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes("Quality Gates Report"),
            )

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }

            if (!overallPass) {
              core.setFailed("Quality gates failed. See PR comment for details.")
            }
